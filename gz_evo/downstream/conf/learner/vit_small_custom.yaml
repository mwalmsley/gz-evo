
encoder_hub_path: !
architecture_name: vit_small_custom # just for naming I think, code just loads checkpoint above
from_scratch: False
channels: 3  # used for augs
input_size: 224
normalize: False

batch_size: 32

learning_rate: 0.0001  # 1e-4

patience: 6
stochastic_depth: 0.0

# deep finetune with decay
layer_decay: 0.9
weight_decay: 0.1
dropout_prob: 0.5
training_mode: full
scheduler_kwargs: {}

# parameters below here don't change / do much

max_epochs: 5000  
check_val_every_n_epoch: 1